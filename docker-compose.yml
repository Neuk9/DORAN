services:
  mongo:
    image: mongo:7
    container_name: doran-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: doran
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  mongo_data:
