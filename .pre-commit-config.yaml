repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (api, etl)
        entry: bash -c 'cd apps/api && uv run ruff check --fix . && cd ../../packages/etl && uv run ruff check --fix .'
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format (api, etl)
        entry: bash -c 'cd apps/api && uv run ruff format . && cd ../../packages/etl && uv run ruff format .'
        language: system
        pass_filenames: false
      - id: prettier
        name: prettier (web)
        entry: bash -c 'cd apps/web && pnpm exec prettier --write "app/**/*.{ts,tsx,css}" "components/**/*.{ts,tsx}" "lib/**/*.ts" "e2e/**/*.ts"'
        language: system
        pass_filenames: false
      - id: tsc
        name: tsc (web)
        entry: bash -c 'cd apps/web && pnpm exec tsc --noEmit'
        language: system
        pass_filenames: false
