version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/apps/api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      api-deps:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/packages/etl"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      etl-deps:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      web-deps:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
