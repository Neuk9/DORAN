name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: bigdata
          POSTGRES_USER: bigdata
          POSTGRES_PASSWORD: bigdata
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bigdata -d bigdata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://bigdata:bigdata@localhost:5433/bigdata
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv sync --frozen
        working-directory: apps/api
      - run: uv run ruff check .
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
      - run: uv run pytest -q
        working-directory: apps/api

  etl:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: bigdata
          POSTGRES_USER: bigdata
          POSTGRES_PASSWORD: bigdata
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bigdata -d bigdata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://bigdata:bigdata@localhost:5433/bigdata
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv sync --frozen
        working-directory: packages/etl
      - run: uv sync --frozen
        working-directory: apps/api
      - run: uv run ruff check .
        working-directory: packages/etl
      - run: uv run alembic upgrade head
        working-directory: apps/api
      - run: uv run pytest -q
        working-directory: packages/etl

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec tsc --noEmit
        working-directory: apps/web
      - run: pnpm exec eslint .
        working-directory: apps/web
      - run: pnpm exec prettier --check "app/**/*.{ts,tsx,css}" "components/**/*.{ts,tsx}" "lib/**/*.ts" "e2e/**/*.ts"
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
