name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: doran_e2e
      LLM_PROVIDER: mock
      API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: apps/api
      - run: uv run python -m app.ingest.seed
        working-directory: apps/api
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: apps/web
      - name: Start API & Web and run smoke checks
        run: |
          (cd apps/api && uv run uvicorn app.main:app --host 127.0.0.1 --port 8000) &
          API_PID=$!
          (cd apps/web && pnpm start -p 3000) &
          WEB_PID=$!
          trap "kill $API_PID $WEB_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null && curl -fsS http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/api/programs | grep -q '"data"'
          curl -fsS http://127.0.0.1:8000/api/regions | grep -q '"data"'
          curl -fsS http://127.0.0.1:3000 >/dev/null
          curl -fsS http://127.0.0.1:3000/chat >/dev/null
          curl -fsS http://127.0.0.1:3000/explore >/dev/null
