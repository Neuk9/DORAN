name: 기능 제안
description: 새 기능이나 개선 아이디어를 제안합니다.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하나요?
      description: 사용자 관점의 문제를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결책
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - API
        - ETL/데이터
        - 웹/UI
        - AI/프롬프트
        - 접근성
        - 문서/CI
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
